<!DOCTYPE html>
<html lang="zh-CN">
<!-- miaoda-super-design | title: <风格词8字内不含产品名> | skeleton: <骨架族待填> | sig: <此稿独有细节待填> -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设计稿标题</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        container: { center: true, padding: '2rem', screens: { '2xl': '1400px' } },
        extend: {
          colors: {
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
            secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
            destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
            muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
            accent: { DEFAULT: 'hsl(var(--accent))', foreground: 'hsl(var(--accent-foreground))' },
            popover: { DEFAULT: 'hsl(var(--popover))', foreground: 'hsl(var(--popover-foreground))' },
            card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' }
          },
          borderRadius: {
            lg: 'var(--radius)',
            md: 'calc(var(--radius) - 2px)',
            sm: 'calc(var(--radius) - 4px)'
          },
          keyframes: {
            /* ===== KEYFRAMES:BEGIN ===== */
            /* ===== KEYFRAMES:END ===== */
          },
          animation: {
            /* ===== ANIMATIONS:BEGIN ===== */
            /* ===== ANIMATIONS:END ===== */
          }
        }
      },
      plugins: [
        function ({ addVariant }) {
          addVariant('intersect', '&:not([no-intersect])');
        }
      ]
    };
  </script>
  <style>
    /* ===== FONT-FACE:BEGIN ===== */
    /* ===== FONT-FACE:END ===== */

    /* ===== DESIGN-TOKENS:BEGIN ===== */
    :root {
      --radius: 0.5rem;
      --background: 0 0% 100%;
      --foreground: 222.2 84% 4.9%;
      --card: 0 0% 100%;
      --card-foreground: 222.2 84% 4.9%;
      --primary: 222.2 47.4% 11.2%;
      --primary-foreground: 210 40% 98%;
      --secondary: 210 40% 96.1%;
      --secondary-foreground: 222.2 47.4% 11.2%;
      --muted: 210 40% 96.1%;
      --muted-foreground: 215.4 16.3% 46.9%;
      --accent: 210 40% 96.1%;
      --accent-foreground: 222.2 47.4% 11.2%;
      --destructive: 0 84.2% 60.2%;
      --destructive-foreground: 210 40% 98%;
      --border: 214.3 31.8% 91.4%;
      --input: 214.3 31.8% 91.4%;
      --ring: 222.2 84% 4.9%;
      --popover: 0 0% 100%;
      --popover-foreground: 222.2 84% 4.9%;
    }
    /* ===== DESIGN-TOKENS:END ===== */

    /* ===== CUSTOM-TOKENS:BEGIN ===== */
    :root {
    }
    /* ===== CUSTOM-TOKENS:END ===== */

    /* ===== SIGNATURE-CSS:BEGIN ===== */
    /* ===== SIGNATURE-CSS:END ===== */
  </style>
</head>
<body class="bg-background text-foreground antialiased">

  <!-- P4 丢弃以下全部 data-preview-only 脚本 -->
  <script src="https://code.bdstatic.com/npm/tailwindcss-intersect@2.2.0/dist/observer.min.js" data-preview-only></script>
  <script type="module" data-preview-only>
    import { animate, inView, scroll, stagger } from "https://cdn.jsdelivr.net/npm/motion@12.23.25/+esm";
    Object.assign(window, { animate, inView, scroll, stagger });
    document.dispatchEvent(new Event('motion:ready'));
  </script>
  <script data-preview-only>
    /* motion 函数由上面的 module 异步挂到 window；解构必须在此回调内，顶层解构会拿到 undefined */
    document.addEventListener('motion:ready', () => {
      const { animate, inView, scroll, stagger } = window;
      /* ===== MOTION-SCRIPT:BEGIN ===== */
      /* ===== MOTION-SCRIPT:END ===== */
    });
  </script>
</body>
</html>
